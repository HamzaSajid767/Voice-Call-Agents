services:
  postgres:
    image: postgres:latest
    container_name: calling_agents_test_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hamza123
      POSTGRES_DB: calling_agents_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calling_agents_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:latest
    container_name: calling_agents_test_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calling_agents_test_app
    env_file:
      - ./.env
    environment:
      NODE_ENV: test
      PORT: 3010
      REDIS_URL: redis://redis:6379/0
      SUPER_ADMIN_EMAILS: admin@test.local
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3010:3010"
    command: ["sh", "-c", "npx prisma db push --skip-generate && node dist/server.js"]
