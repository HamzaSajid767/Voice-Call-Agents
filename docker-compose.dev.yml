services:
  postgres:
    image: postgres:16
    container_name: calling_agents_dev_postgres
    environment:
      POSTGRES_DB: calling_agents_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hamza123
    ports:
      - "5432:5432"
    volumes:
      - calling_agents_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calling_agents_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:latest
    container_name: calling_agents_dev_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:latest
    container_name: calling_agents_dev_qdrant
    ports:
      - "6333:6333"
    volumes:
      - calling_agents_dev_qdrant:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: calling_agents_dev_app
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      PORT: 3010
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:hamza123@postgres:5432/calling_agents_dev
      QDRANT_URL: http://qdrant:6333
      SUPERADMIN_EMAILS: admin@test.local,superadmin@test.local
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "3010:3010"
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  calling_agents_dev_pgdata:
  calling_agents_dev_qdrant:

